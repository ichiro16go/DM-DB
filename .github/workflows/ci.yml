name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # full-db.test.ts is skipped here (no built DB in CI); fixture-based tests cover the pipeline.
      - run: npm test
      - name: Docker image builds
        run: docker build -t dm-card-db:ci .
